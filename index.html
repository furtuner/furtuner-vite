    <!-- Responsive (mobile) layout — live for everyone.

         Two pieces, set before the browser starts layout so there is no flash:
           1. The viewport tag. Real phones (short screen side <= 500px) get
              width=device-width so the page lays out at the phone's own width and
              the mobile layout can switch on. Every other device (desktop, tablet)
              keeps width=1280 exactly as before. Visits with ?testmode=<secret> always
              get device-width so the mobile view can be tried in a desktop browser.
           2. An .ft-responsive class on <html>, which the responsive rules in page.css
              are scoped under. It follows the CURRENT window size (kept in sync on
              resize / rotate), so a mobile browser's "Request Desktop Site" — which
              overrides the viewport tag with its own ~980px canvas — cleanly switches
              back to the desktop layout instead of leaving a half-mobile page.

         Same thresholds as the useMobileTestView hook in DogDietCalculator.tsx and
         App.tsx (<= 640px wide, or <= 930px wide and <= 500px tall): keep all three
         in sync if this is ever changed. -->
    <script>
      (function () {
        var isTestMode = new URLSearchParams(window.location.search).get("testmode") === "7d2132eae669";
        var shortSide = Math.min(window.screen.width, window.screen.height);
        var isPhone = shortSide <= 500;
        document.write(
          '<meta name="viewport" content="' +
          (isTestMode || isPhone ? "width=device-width, initial-scale=1" : "width=1280") +
          '">'
        );

        function updateResponsiveClass() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          var isMobile = w <= 640 || (h <= 500 && w <= 930);
          document.documentElement.classList.toggle("ft-responsive", isMobile);
        }
        updateResponsiveClass();
        window.addEventListener("resize", updateResponsiveClass);
        window.addEventListener("orientationchange", updateResponsiveClass);
      })();
    </script>
