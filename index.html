<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <!-- Responsive design is INTENTIONALLY gated behind the same secret
         used to reveal the "Skip Payment (Testing)" button — real customers
         must keep seeing the exact current scaled-desktop layout; only
         visits with ?testmode=<secret> get the real responsive experience.

         Gating is done TWO ways together, because either one alone has a
         gap:
           1. The viewport tag itself (width=1280 vs device-width) — this
              is what makes the responsive CSS trigger at the *intended*
              breakpoints for a real phone.
           2. An .ft-responsive class on <html>, which every new/changed
              rule in page.css's RESPONSIVE section is scoped under. This
              is the one that actually matters for security-of-behavior:
              mobile browsers' "Request Desktop Site" feature overrides a
              page's own viewport tag with an internal ~980px default,
              regardless of what this page asks for — which used to make
              the responsive CSS fire accidentally for ordinary customers
              who toggled that browser feature, since 980px falls under
              our 1100px breakpoint. The class isn't a viewport report at
              all, so no browser feature can flip it on by accident — only
              this script, only when the secret matches.

         Both are written/set before the browser starts layout — no
         flash/reflow. Keep this testmode value in sync with
         DogDietCalculator.tsx's own copy of the same secret if it's ever
         rotated. -->
    <script>
      (function () {
        var isTestMode = new URLSearchParams(window.location.search).get("testmode") === "7d2132eae669";
        document.write(
          '<meta name="viewport" content="' +
          (isTestMode ? "width=device-width, initial-scale=1" : "width=1280") +
          '">'
        );
        if (!isTestMode) return; // real customers: nothing else to set up

        // Keep .ft-responsive in sync with the CURRENT effective viewport at
        // all times, not just once at initial load. Previously this class
        // was set once here and never touched again — so toggling a mobile
        // browser's "Request Desktop Site" (which overrides the viewport
        // meta tag above with the browser's own ~980px default, regardless
        // of what this page requests) left the class stuck "on": mobile CSS
        // kept partially applying, just rendered in that wider canvas and
        // shrunk to fit — which looks like the mobile view zoomed out,
        // instead of properly switching to the real desktop layout. Same
        // width/height thresholds as the useMobileTestView hook in
        // DogDietCalculator.tsx and App.tsx — keep all three in sync if
        // this is ever changed.
        function updateResponsiveClass() {
          var w = window.innerWidth;
          var h = window.innerHeight;
          var isMobile = w <= 640 || (h <= 500 && w <= 930);
          document.documentElement.classList.toggle("ft-responsive", isMobile);
        }
        updateResponsiveClass();
        window.addEventListener("resize", updateResponsiveClass);
      })();
    </script>
    <title>FurTuner — Science-Based Pet Nutrition</title>

         AI answer engines (GEO) understand what FurTuner is and what it offers. -->

        "name": "FurTuner",
        "url": "https://www.furtuner.com",
        "logo": "https://www.furtuner.com/images/logo.svg",
        "description": "FurTuner provides science-based, personalized homemade pet nutrition plans for dogs and cats, formulated to meet AAFCO nutrient standards.",
        "founder": {
          "@type": "Person",
          "name": "Amer AbuGhazaleh",
          "jobTitle": "Professor and Director, Canine and Feline Nutrition Program, Southern Illinois University Carbondale"
        }
      }
    </script>
