<html lang="en">

    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <!-- Fixed to the desktop layout width (matches the site's 1280px container).
         This means phones, tablets, and rotated monitors always compute CSS media
         queries against 1280px, so the layout never switches to a "mobile" version —
         the browser just scales the whole page to fit the physical screen instead. -->

    <title>FurTuner — Science-Based Pet Nutrition</title>

    <!-- Google Fonts: Marcellus (headline), Manuale (brand), Paprika (price), Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Marcellus&family=Manuale:wght@800&family=Paprika&display=swap"
      rel="stylesheet"
    />
  </head>
