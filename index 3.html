<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <!-- Responsive viewport is INTENTIONALLY gated behind the same secret
         used to reveal the "Skip Payment (Testing)" button — real customers
         must keep seeing the exact current scaled-desktop layout; only
         visits with ?testmode=<secret> get the real responsive viewport
         (and, as a result, the responsive CSS in page.css actually
         activates — those media queries only ever match based on what
         this tag reports, so leaving it at width=1280 for everyone else
         means the responsive rules simply never trigger for them, with
         zero changes needed anywhere else). Written via document.write so
         it's in place before the browser starts layout — no flash/reflow.
         Keep this testmode value in sync with DogDietCalculator.tsx's own
         copy of the same secret if it's ever rotated. -->
    <script>
      (function () {
        var isTestMode = new URLSearchParams(window.location.search).get("testmode") === "7d2132eae669";
        document.write(
          '<meta name="viewport" content="' +
          (isTestMode ? "width=device-width, initial-scale=1" : "width=1280") +
          '">'
        );
      })();
    </script>
    <title>FurTuner — Science-Based Pet Nutrition</title>
    <meta
      name="description"
      content="Choose real ingredients for your dog or cat and get a personalized, AAFCO-balanced homemade diet recipe — no vitamin or mineral premix required."
    />
    <link rel="canonical" href="https://furtuner.com/" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FurTuner" />
    <meta property="og:title" content="FurTuner — Science-Based Pet Nutrition" />
    <meta
      property="og:description"
      content="Homemade pet food, balanced for them, built by you. Choose the ingredients you want to feed your dog or cat and get a personalized, complete and balanced recipe."
    />
    <meta property="og:url" content="https://furtuner.com/" />
    <meta property="og:image" content="https://furtuner.com/images/hero-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FurTuner — Science-Based Pet Nutrition" />
    <meta
      name="twitter:description"
      content="Homemade pet food, balanced for them, built by you. AAFCO-balanced recipes built from the ingredients you choose."
    />
    <meta name="twitter:image" content="https://furtuner.com/images/hero-image.png" />

    <!-- Structured data (Schema.org): helps both traditional search (SEO) and
         AI answer engines (GEO) understand what FurTuner is and what it offers. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "FurTuner",
        "url": "https://furtuner.com",
        "logo": "https://furtuner.com/images/logo.svg",
        "description": "FurTuner provides science-based, personalized homemade pet nutrition plans for dogs and cats, formulated to meet AAFCO nutrient standards.",
        "founder": {
          "@type": "Person",
          "name": "Amer AbuGhazaleh",
          "jobTitle": "Professor and Director, Canine and Feline Nutrition Program, Southern Illinois University Carbondale"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Custom Pet Diet Formulation",
        "name": "FurTuner Custom Diet Plan",
        "provider": {
          "@type": "Organization",
          "name": "FurTuner",
          "url": "https://furtuner.com"
        },
        "areaServed": "Worldwide",
        "description": "A personalized, AAFCO-balanced homemade diet recipe built from ingredients the pet owner chooses, for dogs and cats, across Conventional, Grain-Free, and Meat-Based diet types.",
        "offers": {
          "@type": "Offer",
          "price": "14.95",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Google Fonts: Marcellus (headline), Manuale (brand), Paprika (price), Inter,
         Poltawski Nowy (hero subtitle paragraphs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Marcellus&family=Manuale:wght@800&family=Paprika&family=Poltawski+Nowy:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
